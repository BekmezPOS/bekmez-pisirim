<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bekmez Pişirim - QR Menü</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* === KÖZ VE ANTRASİT (PREMIUM DARK) ARKA PLAN === */
        body { font-family: 'Nunito', sans-serif; background-color: #1e1e24; color: #f1f2f6; margin: 0; padding: 15px; text-align: center; padding-bottom: 120px;}
        
        .header { background: #2b2b36; color: #ff4757; padding: 15px; border-radius: 16px; margin-bottom: 20px; font-size: 22px; font-weight: 900; position: relative; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center;}
        .hamburger { position: absolute; left: 20px; font-size: 26px; cursor: pointer; color: #ffffff; user-select: none; background: #1e1e24; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;}
        
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 100; top: 0; left: 0; background-color: #2b2b36; overflow-x: hidden; transition: 0.3s; padding-top: 60px; box-shadow: 5px 0 25px rgba(0,0,0,0.5); text-align: left; }
        .sidebar a { padding: 16px 25px; text-decoration: none; font-size: 18px; color: #dcdde1; display: block; transition: 0.2s; border-bottom: 1px solid #3f3f4e; font-weight: 700;}
        .sidebar a:hover { color: #ff4757; background-color: #3f3f4e; padding-left: 30px;}
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 36px; border: none; background: none; color: #7f8fa6; }

        .category-tabs { display: flex; justify-content: flex-start; gap: 10px; padding: 5px 0; margin-bottom: 20px; overflow-x: auto; white-space: nowrap; scrollbar-width: none;}
        .category-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: #2b2b36; border: 2px solid #3f3f4e; font-size: 15px; font-weight: 800; color: #a4b0be; padding: 10px 20px; cursor: pointer; border-radius: 20px; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        .tab-btn.active { color: #ffffff; background: #ff4757; border-color: #ff4757; box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4); }

        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .product-card { padding: 15px 12px; border-radius: 18px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; border: none;}
        .product-name { font-size: 15px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; min-height: 45px; text-align: center; line-height: 1.2; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.3);}
        
        .card-anayemek { background: linear-gradient(135deg, #ff4757, #ff6b81); box-shadow: 0 6px 15px rgba(255, 71, 87, 0.3); }
        .card-anayemek .add-btn { color: #e84118; }
        .card-icecek { background: linear-gradient(135deg, #1e90ff, #70a1ff); box-shadow: 0 6px 15px rgba(30, 144, 255, 0.3); }
        .card-icecek .add-btn { color: #192a56; }
        .card-ekstra { background: linear-gradient(135deg, #ffa502, #ff7f50); box-shadow: 0 6px 15px rgba(255, 165, 2, 0.3); }
        .card-ekstra .add-btn { color: #d35400; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; width: 100%;}
        .add-btn { background: #ffffff; border: none; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 14px; width: 100%; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.15);}
        .add-btn:active { transform: scale(0.95); }
        
        /* Sepet Kartları */
        .cart-item { background: #2b2b36; padding: 16px; border-radius: 16px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.2); border: none; border-left: 6px solid #ff4757; transition: 0.2s;}
        
        .cart-controls { display: flex; align-items: center; gap: 12px; background: #1e1e24; border-radius: 12px; padding: 6px; border: 1px solid #3f3f4e;}
        .cart-btn { background: #3f3f4e; color: #ff4757; border: none; border-radius: 8px; width: 36px; height: 36px; font-size: 22px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.2); transition: 0.2s;}
        .cart-btn:active { background: #ff4757; color: white; }
        .cart-amount { font-size: 18px; font-weight: 900; color: #ff4757; min-width: 26px; text-align: center; }

        .note-input { width: 100%; background: #2b2b36; border: 2px solid #3f3f4e; color: #ffffff; padding: 15px; border-radius: 16px; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight:700; margin-bottom: 15px; margin-top: 10px; box-sizing: border-box; resize: none; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        .note-input:focus { outline: none; border-color: #ff4757; background: #1e1e24;}
        .note-input::placeholder { color: #7f8fa6; font-weight: 600;}

        .history-card { flex-direction: column; background: #2b2b36; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); text-align: left; position: relative; overflow: hidden; border-top: 6px solid #ff4757;}
        .history-header { border-bottom: 2px dashed #3f3f4e; padding-bottom: 12px; margin-bottom: 15px; font-size: 15px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; color: #a4b0be;}
        .history-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; color: #ffffff; font-weight: 800;}
        .history-total { text-align: right; font-weight: 900; font-size: 18px; margin-top: 15px; color: #ffffff; border-top: 2px dashed #3f3f4e; padding-top: 15px;}
        
        .live-badge { background-color: #ff4757; color: #ffffff; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 900; animation: pulse 2s infinite;}
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }

        .order-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: #2b2b36; padding: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.4); box-sizing: border-box; z-index: 50; border-top-left-radius: 24px; border-top-right-radius: 24px;}
        .order-btn { background: linear-gradient(135deg, #ff4757, #e84118); color: white; border: none; padding: 16px; font-size: 18px; font-weight: 900; border-radius: 16px; width: 100%; cursor: pointer; box-shadow: 0 6px 15px rgba(232, 65, 24, 0.4); text-transform: uppercase; letter-spacing: 0.5px;}
        .order-btn:active { transform: translateY(2px); box-shadow: 0 2px 8px rgba(232, 65, 24, 0.4);}
        
        .empty-text { color: #7f8fa6; font-weight: 800; margin-top: 50px; font-size: 18px; }
    </style>
</head>
<body>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="KapatSidebar()">&times;</a>
        <a href="javascript:void(0)" onclick="SayfaGoster('urunler')">🍔 Menü / Ürünler</a>
        <a href="javascript:void(0)" onclick="SayfaGoster('sepet')">🛒 Siparişim (<span id="sidebar-sepet-adet">0</span>)</a>
        <a href="javascript:void(0)" onclick="SayfaGoster('gecmis')" style="color:#ff4757; background: #3f3f4e; border-radius: 12px; margin: 0 10px;">🧾 Canlı Adisyonum</a>
    </div>

    <div class="header">
        <div class="hamburger" onclick="AcSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </div>
        <span id="masa-baslik">Bekmez Pişirim</span>
    </div>

    <div id="menu-container">
        <div class="category-tabs" id="kategori-sekmeleri" style="display: none;">
            <button class="tab-btn active" id="tab-Ana Yemek" onclick="KategoriSec('Ana Yemek')">Ana Yemek</button>
            <button class="tab-btn" id="tab-İçecek" onclick="KategoriSec('İçecek')">İçecek</button>
            <button class="tab-btn" id="tab-Ekstra" onclick="KategoriSec('Ekstra')">Ekstra</button>
        </div>
        <h3 id="yukleniyor" class="empty-text">Buluttan Menü Çekiliyor...</h3>
        <div id="menu-grid" class="grid-container"></div>
    </div>

    <div id="cart-container" style="display: none; padding-bottom: 40px;"></div>
    <div id="history-container" style="display: none; padding-bottom: 80px;"></div>

    <div class="order-panel" id="alt-panel">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 900; font-size: 19px;">
            <span style="color: #dcdde1;">Ara Toplam:</span>
            <span id="sepet-tutar" style="color: #ff4757; font-size: 24px;">0.00 TL</span>
        </div>
        <button class="order-btn" onclick="SiparisGonder()">Sepeti Onayla</button>
    </div>

    <script>
        const firebaseMenuUrl = "https://bekmezpos-default-rtdb.firebaseio.com/Menu.json";
        const firebaseSiparisUrl = "https://bekmezpos-default-rtdb.firebaseio.com/Siparisler.json";
        
        let sepet = [];
        let toplamFiyat = 0;
        let tumUrunler = [];
        let aktifKategori = 'Ana Yemek';
        let canliAdisyonTimer = null; 
        
        const urlParams = new URLSearchParams(window.location.search);
        let guncelMasaNo = urlParams.get('masa') || 1;

        window.onload = function() {
            document.getElementById("masa-baslik").innerText = "Masa #" + guncelMasaNo;
            fetch(firebaseMenuUrl).then(r => r.json()).then(data => {
                document.getElementById("yukleniyor").style.display = "none";
                if(data && data.products) {
                    tumUrunler = data.products;
                    document.getElementById("kategori-sekmeleri").style.display = "flex";
                    KategoriSec('Ana Yemek'); 
                }
            });
        }

        function UrunKategorisiBul(isim) {
            let ad = isim.toLocaleLowerCase('tr-TR'); 
            if(ad.includes("cola") || ad.includes("kola") || ad.includes("ayran") || ad.includes("şalgam") || ad.includes("su") || ad.includes("fanta") || ad.includes("soda") || ad.includes("sprite") || ad.includes("gazoz") || ad.includes("içecek") || ad.includes("meyve")) return "İçecek";
            if(ad.includes("ekmek") || ad.includes("pide") || ad.includes("somun") || ad.includes("lavaş") || ad.includes("salata") || ad.includes("ezme") || ad.includes("sos") || ad.includes("meze") || ad.includes("yoğurt") || ad.includes("biber") || ad.includes("patates") || ad.includes("pilav")) return "Ekstra";
            return "Ana Yemek";
        }

        function KategoriSec(kategoriAdi) {
            aktifKategori = kategoriAdi;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + kategoriAdi).classList.add('active');

            const gridContainer = document.getElementById("menu-grid");
            gridContainer.innerHTML = "";
            
            tumUrunler.forEach(urun => {
                let urunTuru = UrunKategorisiBul(urun.pName);
                if(urunTuru === aktifKategori) {
                    
                    let kartSinifi = "";
                    if(urunTuru === "Ana Yemek") kartSinifi = "card-anayemek";
                    else if (urunTuru === "İçecek") kartSinifi = "card-icecek";
                    else kartSinifi = "card-ekstra"; 

                    let butonHTML = urun.isKg 
                        ? `<div class="btn-group"><button class="add-btn" onclick="SepeteEkle('${urun.pName}', '${urun.price1Kg}', '1 KG', this)">1 KG (${urun.price1Kg}₺)</button><button class="add-btn" onclick="SepeteEkle('${urun.pName}', '${urun.price750g}', '750 Gr', this)">750 Gr (${urun.price750g}₺)</button><button class="add-btn" onclick="SepeteEkle('${urun.pName}', '${urun.price500g}', '500 Gr', this)">500 Gr (${urun.price500g}₺)</button></div>`
                        : `<div class="btn-group"><button class="add-btn" onclick="SepeteEkle('${urun.pName}', '${urun.price1Kg}', '1 Adet', this)">+ Sepete Ekle (${urun.price1Kg}₺)</button></div>`;
                    
                    gridContainer.innerHTML += `
                    <div class="product-card ${kartSinifi}">
                        <div class="product-name">${urun.pName}</div>
                        ${butonHTML}
                    </div>`;
                }
            });
        }

        function AcSidebar() { document.getElementById("mySidebar").style.width = "270px"; }
        function KapatSidebar() { document.getElementById("mySidebar").style.width = "0"; }

        function SayfaGoster(sayfa) {
            KapatSidebar();
            if(canliAdisyonTimer) clearInterval(canliAdisyonTimer);
            
            document.getElementById("menu-container").style.display = "none";
            document.getElementById("cart-container").style.display = "none";
            document.getElementById("history-container").style.display = "none";
            
            if(sayfa === 'urunler') {
                document.getElementById("menu-container").style.display = "block";
                document.getElementById("alt-panel").style.display = "block"; 
            } 
            else if (sayfa === 'sepet') {
                document.getElementById("cart-container").style.display = "block";
                document.getElementById("alt-panel").style.display = "block";
                SepetEkraniniCiz(); 
            }
            else if (sayfa === 'gecmis') {
                document.getElementById("history-container").style.display = "block";
                document.getElementById("alt-panel").style.display = "none"; 
                CanliAdisyonCek();
                canliAdisyonTimer = setInterval(CanliAdisyonCek, 3000);
            }
        }

        function SepeteEkle(isim, fiyatStr, miktarText, btnObj) {
            let fiyatNum = parseFloat(fiyatStr.replace(",", "."));
            let tamIsim = miktarText + " " + isim;
            let mevcut = sepet.find(u => u.itemName === tamIsim);
            if(mevcut) { mevcut.amount += 1; } else { sepet.push({ itemName: tamIsim, itemPrice: fiyatNum, amount: 1, rawName: isim }); }
            HesaplaVeGuncelle();
            
            let orjinalMetin = btnObj.innerText;
            btnObj.innerText = "✓ Eklendi"; 
            btnObj.style.background = "#2ed573"; 
            btnObj.style.color = "#ffffff";
            setTimeout(() => { 
                btnObj.innerText = orjinalMetin; 
                btnObj.style.background = ""; 
                btnObj.style.color = ""; 
            }, 600);
        }

        function MiktarDegistir(index, degisimMiktari) {
            sepet[index].amount += degisimMiktari;
            if(sepet[index].amount <= 0) { sepet.splice(index, 1); }
            HesaplaVeGuncelle(); SepetEkraniniCiz(); 
        }

        function HesaplaVeGuncelle() {
            toplamFiyat = 0; let toplamAdet = 0;
            sepet.forEach(urun => { toplamFiyat += (urun.itemPrice * urun.amount); toplamAdet += urun.amount; });
            document.getElementById("sepet-tutar").innerText = toplamFiyat.toFixed(2) + " TL";
            document.getElementById("sidebar-sepet-adet").innerText = toplamAdet;
        }

        function SepetEkraniniCiz() {
            const container = document.getElementById("cart-container");
            if(sepet.length === 0) {
                container.innerHTML = `<div class="empty-text">Sepetiniz şu an boş 🛒</div><br><button class="order-btn" style="width:70%; margin-top:10px; font-size:16px; background:#2b2b36; color:#ffffff; border:2px solid #3f3f4e; box-shadow:0 4px 10px rgba(0,0,0,0.2);" onclick="SayfaGoster('urunler')">Ürünlere Göz At</button>`;
                return;
            }
            let html = `<h2 style="color:#ffffff; margin-top:0; font-weight:900;">Sepetim</h2>`;
            sepet.forEach((urun, index) => {
                let satirFiyati = (urun.itemPrice * urun.amount).toFixed(2);
                html += `
                <div class="cart-item">
                    <div style="flex:1; padding-right:10px;">
                        <div class="product-name" style="font-size:16px; min-height:auto; justify-content:flex-start; margin-bottom:6px; color:#ffffff; text-shadow:none; text-align:left;">${urun.itemName}</div>
                        <div style="color:#ff4757; font-weight:900; font-size:16px; text-align:left;">${satirFiyati} TL</div>
                    </div>
                    <div class="cart-controls">
                        <button class="cart-btn" onclick="MiktarDegistir(${index}, -1)">-</button>
                        <div class="cart-amount">${urun.amount}</div>
                        <button class="cart-btn" onclick="MiktarDegistir(${index}, 1)">+</button>
                    </div>
                </div>`;
            });
            
            html += `<textarea id="siparis-notu" class="note-input" rows="2" placeholder="Şefe Notunuz (Örn: Acısız olsun)"></textarea>`;
            
            html += `<button class="order-btn" style="padding:16px; width:100%; font-size:16px; background:#2b2b36; color:#ffffff; border:2px solid #3f3f4e; box-shadow:0 4px 10px rgba(0,0,0,0.2);" onclick="SayfaGoster('urunler')">+ Masaya Başka Ürün Ekle</button>`;
            container.innerHTML = html;
        }

        function CanliAdisyonCek() {
            const url = "https://bekmezpos-default-rtdb.firebaseio.com/CanliMasalar.json";
            
            fetch(url).then(r => r.json()).then(data => {
                const container = document.getElementById("history-container");
                if(!data || !data.aktifMasalar) {
                    container.innerHTML = `<div class="empty-text">Henüz masanıza işlenen bir sipariş yok 🍽️</div><br><button class="order-btn" style="width:70%; margin-top:10px; font-size:16px; background:#2b2b36; color:#ffffff; border:2px solid #3f3f4e; box-shadow:0 4px 10px rgba(0,0,0,0.2);" onclick="SayfaGoster('urunler')">Sipariş Ver</button>`;
                    return;
                }
                
                let benimMasam = data.aktifMasalar.find(m => m.masaId === parseInt(guncelMasaNo));
                if(!benimMasam) {
                    container.innerHTML = `<div class="empty-text">Hesabınız kesilmiş veya sipariş hazırlanıyor.</div><br><button class="order-btn" style="width:70%; margin-top:10px; font-size:16px; background:#2b2b36; color:#ffffff; border:2px solid #3f3f4e; box-shadow:0 4px 10px rgba(0,0,0,0.2);" onclick="SayfaGoster('urunler')">Yeni Sipariş Ver</button>`;
                    return;
                }

                let html = `<h2 style="color:#ffffff; margin-top:0; font-weight:900;">Canlı Masam</h2>`;
                html += `<div class="history-card">`;
                html += `  <div class="history-header">
                             <span>Sipariş Durumu</span>
                             <span class="live-badge">Mutfağa İletildi ✓</span>
                           </div>`;
                
                benimMasam.siparisler.forEach(urun => {
                    let satirFiyati = (urun.itemPrice * urun.amount).toFixed(2);
                    html += `<div class="history-item">
                               <span><b style="color:#ff4757;">${urun.amount}x</b> ${urun.itemName}</span>
                               <span>${satirFiyati} ₺</span>
                             </div>`;
                });

                // === YENİ: SİPARİŞ NOTU BURADA GÖSTERİLİYOR ===
                if (benimMasam.siparisNotu && benimMasam.siparisNotu.trim() !== "") {
                    html += `<div style="margin-top: 15px; padding: 12px; background: #1e1e24; border-radius: 10px; border-left: 4px solid #ff4757; font-size: 14px; color: #a4b0be; font-style: italic;">
                               <b style="color: #ff4757;">Notunuz:</b> ${benimMasam.siparisNotu}
                             </div>`;
                }
                
                html += `<div class="history-total">Toplam Tutar: ${benimMasam.toplamTutar.toFixed(2)} TL</div>`;
                html += `</div>`;
                html += `<br><button class="order-btn" style="padding:16px; width:100%; font-size:16px; background:#2b2b36; color:#ffffff; border:2px solid #3f3f4e; box-shadow:0 4px 10px rgba(0,0,0,0.2);" onclick="SayfaGoster('urunler')">Masaya Yeni Ürün Söyle</button>`;
                
                container.innerHTML = html;
            }).catch(e => console.log("Canlı yayın çekilemedi"));
        }

        function SiparisGonder() {
            if(sepet.length === 0) { alert("Sepetiniz boş!"); SayfaGoster('urunler'); return; }

            let notKutusu = document.getElementById("siparis-notu");
            let alinanNot = notKutusu ? notKutusu.value : "";

            const siparisVerisi = {
                masaId: parseInt(guncelMasaNo), 
                siparisler: sepet,
                toplam: toplamFiyat,
                durum: "bekliyor", 
                zaman: new Date().toLocaleTimeString(),
                siparisNotu: alinanNot 
            };

            let gonderButonu = document.querySelector(".order-btn");
            gonderButonu.disabled = true; gonderButonu.innerText = "İLETİLİYOR...";

            fetch(firebaseSiparisUrl, {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(siparisVerisi)
            }).then(response => {
                alert("Sipariş başarıyla ustaya iletildi!");
                sepet = [];
                HesaplaVeGuncelle();
                SayfaGoster('gecmis'); 
                gonderButonu.disabled = false; gonderButonu.innerText = "SEPETİ ONAYLA";
            }).catch(error => {
                alert("Hata! Bağlantınızı kontrol edin.");
                gonderButonu.disabled = false; gonderButonu.innerText = "SEPETİ ONAYLA";
            });
        }
    </script>
</body>
</html>
